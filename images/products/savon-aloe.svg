<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="aloeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9"/>
      <stop offset="50%" style="stop-color:#C8E6C9"/>
      <stop offset="100%" style="stop-color:#A5D6A7"/>
    </linearGradient>
    <linearGradient id="aloeSoap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784"/>
      <stop offset="50%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>
    <linearGradient id="aloeTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A5D6A7"/>
      <stop offset="100%" style="stop-color:#81C784"/>
    </linearGradient>
    <linearGradient id="aloeLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="50%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
    <linearGradient id="gelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8E6C9" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#A5D6A7" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="aloeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4CAF50" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect width="400" height="400" fill="url(#aloeBg)"/>
  
  <!-- Feuilles d'aloe vera décoratives -->
  <g transform="translate(50, 200)">
    <path d="M0 80 Q-10 40 5 0 Q15 -20 25 0 Q35 40 30 80 Z" fill="url(#aloeLeaf)"/>
    <path d="M15 0 Q15 25 15 75" stroke="#388E3C" stroke-width="1.5" fill="none"/>
    <!-- Épines -->
    <path d="M8 20 L3 18" stroke="#388E3C" stroke-width="1"/>
    <path d="M22 20 L27 18" stroke="#388E3C" stroke-width="1"/>
    <path d="M7 40 L2 38" stroke="#388E3C" stroke-width="1"/>
    <path d="M23 40 L28 38" stroke="#388E3C" stroke-width="1"/>
  </g>
  
  <g transform="translate(330, 100) rotate(15)">
    <path d="M0 60 Q-8 30 3 0 Q12 -15 18 0 Q28 30 22 60 Z" fill="url(#aloeLeaf)"/>
    <path d="M11 0 Q11 20 11 55" stroke="#388E3C" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Savon principal -->
  <g filter="url(#aloeShadow)">
    <!-- Forme rectangulaire arrondie transparente -->
    <rect x="100" y="150" width="200" height="150" rx="25" fill="url(#aloeSoap)"/>
    
    <!-- Effet gel transparent -->
    <rect x="110" y="160" width="180" height="130" rx="20" fill="url(#gelGrad)"/>
    
    <!-- Face supérieure -->
    <path d="M110 165 L290 165 L295 155 C295 145 285 140 275 140 L125 140 C115 140 105 145 105 155 Z" fill="url(#aloeTop)"/>
    
    <!-- Morceaux d'aloe dans le savon -->
    <ellipse cx="150" cy="200" rx="15" ry="8" fill="#4CAF50" opacity="0.4"/>
    <ellipse cx="220" cy="220" rx="12" ry="6" fill="#4CAF50" opacity="0.35"/>
    <ellipse cx="180" cy="250" rx="14" ry="7" fill="#4CAF50" opacity="0.3"/>
    <ellipse cx="260" cy="190" rx="10" ry="5" fill="#4CAF50" opacity="0.4"/>
    
    <!-- Bulles dans le gel -->
    <circle cx="140" cy="180" r="4" fill="#fff" opacity="0.6"/>
    <circle cx="250" cy="210" r="3" fill="#fff" opacity="0.5"/>
    <circle cx="190" cy="270" r="3.5" fill="#fff" opacity="0.5"/>
    
    <!-- Reflet -->
    <ellipse cx="160" cy="155" rx="30" ry="10" fill="#C8E6C9" opacity="0.7"/>
  </g>
  
  <!-- Feuille d'aloe coupée sur le savon -->
  <g transform="translate(200, 220)">
    <path d="M-25 30 Q-30 0 -15 -25 Q0 -40 15 -25 Q30 0 25 30 Z" fill="url(#aloeLeaf)"/>
    <!-- Section coupée montrant le gel -->
    <ellipse cx="0" cy="30" rx="22" ry="12" fill="#A5D6A7"/>
    <ellipse cx="0" cy="30" rx="16" ry="8" fill="#C8E6C9"/>
    <!-- Ligne centrale -->
    <path d="M0 -20 Q0 5 0 25" stroke="#388E3C" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Fleurs de camomille -->
  <g transform="translate(320, 300)">
    <circle cx="0" cy="0" r="15" fill="#fff"/>
    <circle cx="0" cy="0" r="6" fill="#FFD54F"/>
    <ellipse cx="0" cy="-12" rx="4" ry="8" fill="#fff"/>
    <ellipse cx="0" cy="12" rx="4" ry="8" fill="#fff"/>
    <ellipse cx="-12" cy="0" rx="8" ry="4" fill="#fff"/>
    <ellipse cx="12" cy="0" rx="8" ry="4" fill="#fff"/>
  </g>
  
  <g transform="translate(80, 340) scale(0.7)">
    <circle cx="0" cy="0" r="12" fill="#fff"/>
    <circle cx="0" cy="0" r="5" fill="#FFD54F"/>
  </g>
  
  <!-- Gouttes d'eau/gel -->
  <path d="M340 180 Q345 190 340 200 Q335 190 340 180 Z" fill="#A5D6A7" opacity="0.7"/>
  <path d="M350 195 Q353 202 350 208 Q347 202 350 195 Z" fill="#A5D6A7" opacity="0.6"/>
  
  <!-- Badge Eco+ -->
  <g transform="translate(80, 80)">
    <rect x="-30" y="-18" width="60" height="36" rx="18" fill="#388E3C"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">ÉCO+</text>
  </g>
</svg>