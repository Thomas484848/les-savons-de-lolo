<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="citrusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E8"/>
      <stop offset="50%" style="stop-color:#FFECB3"/>
      <stop offset="100%" style="stop-color:#FFE082"/>
    </linearGradient>
    <linearGradient id="citrusSoap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D"/>
      <stop offset="50%" style="stop-color:#F5B041"/>
      <stop offset="100%" style="stop-color:#E69500"/>
    </linearGradient>
    <linearGradient id="citrusTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCC80"/>
      <stop offset="100%" style="stop-color:#FFB74D"/>
    </linearGradient>
    <linearGradient id="orangeSlice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
    <filter id="citrusShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E69500" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect width="400" height="400" fill="url(#citrusBg)"/>
  
  <!-- Tranches d'agrumes décoratives -->
  <!-- Orange en haut à droite -->
  <g transform="translate(330, 80)">
    <circle cx="0" cy="0" r="35" fill="#FF9800"/>
    <circle cx="0" cy="0" r="28" fill="#FFB74D"/>
    <circle cx="0" cy="0" r="5" fill="#fff"/>
    <g stroke="#fff" stroke-width="2">
      <line x1="0" y1="-28" x2="0" y2="-5"/>
      <line x1="0" y1="5" x2="0" y2="28"/>
      <line x1="-28" y1="0" x2="-5" y2="0"/>
      <line x1="5" y1="0" x2="28" y2="0"/>
      <line x1="-20" y1="-20" x2="-4" y2="-4"/>
      <line x1="4" y1="4" x2="20" y2="20"/>
      <line x1="-20" y1="20" x2="-4" y2="4"/>
      <line x1="4" y1="-4" x2="20" y2="-20"/>
    </g>
  </g>
  
  <!-- Citron en bas à gauche -->
  <g transform="translate(60, 320)">
    <ellipse cx="0" cy="0" rx="30" ry="25" fill="#FDD835"/>
    <ellipse cx="0" cy="0" rx="22" ry="18" fill="#FFEB3B"/>
    <circle cx="0" cy="0" r="4" fill="#fff"/>
    <g stroke="#fff" stroke-width="1.5">
      <line x1="0" y1="-18" x2="0" y2="-4"/>
      <line x1="0" y1="4" x2="0" y2="18"/>
      <line x1="-22" y1="0" x2="-4" y2="0"/>
      <line x1="4" y1="0" x2="22" y2="0"/>
    </g>
  </g>
  
  <!-- Savon principal -->
  <g filter="url(#citrusShadow)">
    <!-- Forme organique/galet -->
    <ellipse cx="200" cy="230" rx="120" ry="80" fill="url(#citrusSoap)"/>
    <ellipse cx="200" cy="175" rx="105" ry="55" fill="url(#citrusTop)"/>
    
    <!-- Zestes d'agrumes dans le savon -->
    <ellipse cx="150" cy="200" rx="8" ry="4" fill="#FF9800" opacity="0.7" transform="rotate(-25 150 200)"/>
    <ellipse cx="220" cy="185" rx="6" ry="3" fill="#FDD835" opacity="0.6" transform="rotate(15 220 185)"/>
    <ellipse cx="250" cy="220" rx="7" ry="3.5" fill="#FF9800" opacity="0.6" transform="rotate(-10 250 220)"/>
    <ellipse cx="170" cy="240" rx="5" ry="2.5" fill="#FDD835" opacity="0.5" transform="rotate(30 170 240)"/>
    
    <!-- Reflet -->
    <ellipse cx="160" cy="160" rx="35" ry="15" fill="#FFCC80" opacity="0.6"/>
  </g>
  
  <!-- Tranche d'orange sur le savon -->
  <g transform="translate(200, 210)">
    <ellipse cx="0" cy="0" rx="30" ry="25" fill="#FF9800"/>
    <ellipse cx="0" cy="0" rx="24" ry="20" fill="#FFB74D"/>
    <circle cx="0" cy="0" r="4" fill="#FFF8E1"/>
    <g stroke="#FFF8E1" stroke-width="2">
      <line x1="0" y1="-20" x2="0" y2="-4"/>
      <line x1="0" y1="4" x2="0" y2="20"/>
      <line x1="-24" y1="0" x2="-4" y2="0"/>
      <line x1="4" y1="0" x2="24" y2="0"/>
      <line x1="-17" y1="-14" x2="-3" y2="-3"/>
      <line x1="3" y1="3" x2="17" y2="14"/>
    </g>
  </g>
  
  <!-- Feuilles -->
  <g transform="translate(320, 250)">
    <path d="M0 0 Q15 -20 5 -40 Q-10 -25 0 0 Z" fill="#4CAF50"/>
    <line x1="5" y1="-35" x2="0" y2="-5" stroke="#388E3C" stroke-width="1"/>
  </g>
  
  <!-- Bulles pétillantes -->
  <circle cx="100" cy="150" r="10" fill="#fff" opacity="0.5"/>
  <circle cx="115" cy="135" r="6" fill="#fff" opacity="0.4"/>
  <circle cx="90" cy="130" r="4" fill="#fff" opacity="0.3"/>
  
  <!-- Badge Énergisant -->
  <g transform="translate(80, 80)">
    <polygon points="0,-35 10,-12 35,-12 15,5 22,30 0,15 -22,30 -15,5 -35,-12 -10,-12" fill="#E69500"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">ÉNERGIE</text>
  </g>
</svg>