<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="mintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5EE"/>
      <stop offset="50%" style="stop-color:#D4F1E4"/>
      <stop offset="100%" style="stop-color:#B8E4CF"/>
    </linearGradient>
    <linearGradient id="mintSoap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8ED4B0"/>
      <stop offset="50%" style="stop-color:#7BC9A6"/>
      <stop offset="100%" style="stop-color:#5AB88D"/>
    </linearGradient>
    <linearGradient id="mintTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A8E4C4"/>
      <stop offset="100%" style="stop-color:#7BC9A6"/>
    </linearGradient>
    <filter id="mintShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5AB88D" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect width="400" height="400" fill="url(#mintBg)"/>
  
  <!-- Feuilles de menthe décoratives -->
  <g transform="translate(60, 80) rotate(-20)">
    <path d="M0 40 Q-15 20 0 0 Q15 20 0 40 Z" fill="#5AB88D"/>
    <line x1="0" y1="40" x2="0" y2="5" stroke="#4A9A7A" stroke-width="1"/>
  </g>
  
  <g transform="translate(340, 320) rotate(30)">
    <path d="M0 50 Q-20 25 0 0 Q20 25 0 50 Z" fill="#7BC9A6"/>
    <line x1="0" y1="50" x2="0" y2="5" stroke="#5AB88D" stroke-width="1"/>
  </g>
  
  <g transform="translate(50, 300) rotate(-10)">
    <path d="M0 35 Q-12 17 0 0 Q12 17 0 35 Z" fill="#8ED4B0"/>
    <line x1="0" y1="35" x2="0" y2="5" stroke="#6BB896" stroke-width="1"/>
  </g>
  
  <!-- Savon principal -->
  <g filter="url(#mintShadow)">
    <!-- Face avant du savon (arrondi) -->
    <ellipse cx="200" cy="240" rx="110" ry="70" fill="url(#mintSoap)"/>
    
    <!-- Face supérieure du savon -->
    <ellipse cx="200" cy="180" rx="100" ry="50" fill="url(#mintTop)"/>
    
    <!-- Connexion 3D -->
    <path d="M100 180 Q100 240 110 240 L290 240 Q300 240 300 180" fill="url(#mintSoap)" opacity="0.8"/>
    
    <!-- Texture du savon - petits points verts -->
    <circle cx="160" cy="200" r="4" fill="#5AB88D" opacity="0.6"/>
    <circle cx="220" cy="190" r="3" fill="#5AB88D" opacity="0.5"/>
    <circle cx="180" cy="220" r="5" fill="#5AB88D" opacity="0.4"/>
    <circle cx="240" cy="210" r="4" fill="#5AB88D" opacity="0.5"/>
    <circle cx="200" cy="240" r="3" fill="#5AB88D" opacity="0.4"/>
    
    <!-- Reflet -->
    <ellipse cx="160" cy="165" rx="30" ry="12" fill="#C8F0DC" opacity="0.7"/>
  </g>
  
  <!-- Feuilles de menthe sur le savon -->
  <g transform="translate(200, 200)">
    <path d="M0 0 Q-25 -20 -5 -45 Q10 -25 0 0 Z" fill="#4A9A7A"/>
    <line x1="-5" y1="-40" x2="-2" y2="-5" stroke="#3A8A6A" stroke-width="1"/>
    <path d="M5 -5 Q25 -30 10 -50 Q-5 -30 5 -5 Z" fill="#5AB88D"/>
    <line x1="10" y1="-45" x2="7" y2="-10" stroke="#4A9A7A" stroke-width="1"/>
  </g>
  
  <!-- Bulles fraîcheur -->
  <circle cx="300" cy="150" r="15" fill="#fff" opacity="0.5"/>
  <circle cx="320" cy="130" r="8" fill="#fff" opacity="0.4"/>
  <circle cx="80" cy="200" r="12" fill="#fff" opacity="0.4"/>
  <circle cx="95" cy="180" r="6" fill="#fff" opacity="0.3"/>
  
  <!-- Badge Nouveau -->
  <g transform="translate(320, 60)">
    <rect x="-35" y="-15" width="70" height="30" rx="15" fill="#4A7C59"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">NOUVEAU</text>
  </g>
</svg>