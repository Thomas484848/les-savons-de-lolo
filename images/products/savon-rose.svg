<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="roseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF0F0"/>
      <stop offset="50%" style="stop-color:#F8E0E0"/>
      <stop offset="100%" style="stop-color:#EFD0D0"/>
    </linearGradient>
    <linearGradient id="roseSoap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B0B0"/>
      <stop offset="50%" style="stop-color:#D4A5A5"/>
      <stop offset="100%" style="stop-color:#C08080"/>
    </linearGradient>
    <linearGradient id="roseTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C0C0"/>
      <stop offset="100%" style="stop-color:#E0A8A8"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C0C0"/>
      <stop offset="100%" style="stop-color:#E09090"/>
    </linearGradient>
    <filter id="roseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C08080" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect width="400" height="400" fill="url(#roseBg)"/>
  
  <!-- Pétales de rose éparpillés -->
  <g opacity="0.4">
    <ellipse cx="60" cy="100" rx="15" ry="10" fill="#E8B0B0" transform="rotate(-30 60 100)"/>
    <ellipse cx="340" cy="80" rx="12" ry="8" fill="#D4A5A5" transform="rotate(20 340 80)"/>
    <ellipse cx="50" cy="300" rx="14" ry="9" fill="#E8B0B0" transform="rotate(-45 50 300)"/>
    <ellipse cx="350" cy="320" rx="11" ry="7" fill="#D4A5A5" transform="rotate(35 350 320)"/>
    <ellipse cx="320" cy="200" rx="10" ry="6" fill="#E8B0B0" transform="rotate(-15 320 200)"/>
  </g>
  
  <!-- Savon principal -->
  <g filter="url(#roseShadow)">
    <!-- Forme coeur stylisé -->
    <path d="M200 300 C120 260 80 200 100 150 C120 100 160 100 200 140 C240 100 280 100 300 150 C320 200 280 260 200 300 Z" fill="url(#roseSoap)"/>
    
    <!-- Face supérieure -->
    <path d="M200 280 C140 250 110 200 125 160 C140 120 170 120 200 150 C230 120 260 120 275 160 C290 200 260 250 200 280 Z" fill="url(#roseTop)"/>
    
    <!-- Texture argile rose -->
    <circle cx="160" cy="190" r="8" fill="#C08080" opacity="0.3"/>
    <circle cx="230" cy="200" r="6" fill="#C08080" opacity="0.25"/>
    <circle cx="200" cy="240" r="7" fill="#C08080" opacity="0.2"/>
    
    <!-- Reflet -->
    <ellipse cx="160" cy="160" rx="20" ry="10" fill="#F8D0D0" opacity="0.6"/>
  </g>
  
  <!-- Rose décorative sur le savon -->
  <g transform="translate(200, 190)">
    <!-- Pétales extérieurs -->
    <ellipse cx="-20" cy="0" rx="15" ry="10" fill="url(#petalGrad)" transform="rotate(-30 -20 0)"/>
    <ellipse cx="20" cy="0" rx="15" ry="10" fill="url(#petalGrad)" transform="rotate(30 20 0)"/>
    <ellipse cx="0" cy="-15" rx="14" ry="9" fill="url(#petalGrad)" transform="rotate(0 0 -15)"/>
    <ellipse cx="-15" cy="12" rx="13" ry="8" fill="url(#petalGrad)" transform="rotate(-60 -15 12)"/>
    <ellipse cx="15" cy="12" rx="13" ry="8" fill="url(#petalGrad)" transform="rotate(60 15 12)"/>
    
    <!-- Centre de la rose -->
    <circle cx="0" cy="0" r="10" fill="#E09090"/>
    <path d="M0 -5 Q5 0 0 5 Q-5 0 0 -5" fill="#C07070"/>
  </g>
  
  <!-- Boutons de rose -->
  <g transform="translate(90, 180)">
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="#D4A5A5"/>
    <path d="M0 -12 Q3 -8 0 -4 Q-3 -8 0 -12" fill="#C08080"/>
    <line x1="0" y1="12" x2="0" y2="30" stroke="#6B8E6B" stroke-width="2"/>
    <path d="M0 20 Q-8 18 -10 25" fill="none" stroke="#6B8E6B" stroke-width="1.5"/>
  </g>
  
  <g transform="translate(310, 240)">
    <ellipse cx="0" cy="0" rx="6" ry="10" fill="#E8B0B0"/>
    <path d="M0 -10 Q2 -6 0 -3 Q-2 -6 0 -10" fill="#D4A5A5"/>
    <line x1="0" y1="10" x2="0" y2="25" stroke="#6B8E6B" stroke-width="1.5"/>
  </g>
  
  <!-- Bulles -->
  <circle cx="280" cy="130" r="12" fill="#fff" opacity="0.4"/>
  <circle cx="300" cy="115" r="7" fill="#fff" opacity="0.3"/>
  
  <!-- Badge Luxe -->
  <g transform="translate(320, 340)">
    <circle cx="0" cy="0" r="30" fill="#C08080"/>
    <text x="0" y="-3" text-anchor="middle" font-family="Georgia" font-size="10" font-style="italic" fill="#fff">Luxe</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">★★★★★</text>
  </g>
</svg>