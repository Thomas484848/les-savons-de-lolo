<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="lavenderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0F8"/>
      <stop offset="50%" style="stop-color:#E8DEF0"/>
      <stop offset="100%" style="stop-color:#D4C4E0"/>
    </linearGradient>
    <linearGradient id="lavenderSoap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8A0D0"/>
      <stop offset="50%" style="stop-color:#9B7BB8"/>
      <stop offset="100%" style="stop-color:#7D5FA0"/>
    </linearGradient>
    <linearGradient id="lavenderTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8B8D8"/>
      <stop offset="100%" style="stop-color:#A890C0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7D5FA0" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect width="400" height="400" fill="url(#lavenderBg)"/>
  
  <!-- Décoration florale -->
  <g opacity="0.3">
    <circle cx="50" cy="60" r="8" fill="#9B7BB8"/>
    <circle cx="70" cy="50" r="5" fill="#B8A0D0"/>
    <circle cx="350" cy="340" r="10" fill="#9B7BB8"/>
    <circle cx="330" cy="360" r="6" fill="#B8A0D0"/>
  </g>
  
  <!-- Brins de lavande décoratifs -->
  <g transform="translate(320, 80) rotate(15)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#6B8E6B" stroke-width="2"/>
    <ellipse cx="-3" cy="8" rx="4" ry="6" fill="#9B7BB8"/>
    <ellipse cx="3" cy="14" rx="4" ry="6" fill="#8B6BA8"/>
    <ellipse cx="-3" cy="20" rx="4" ry="6" fill="#9B7BB8"/>
    <ellipse cx="3" cy="26" rx="4" ry="6" fill="#8B6BA8"/>
    <ellipse cx="-3" cy="32" rx="4" ry="6" fill="#9B7BB8"/>
  </g>
  
  <g transform="translate(340, 100) rotate(25)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#6B8E6B" stroke-width="2"/>
    <ellipse cx="-3" cy="6" rx="3" ry="5" fill="#B8A0D0"/>
    <ellipse cx="3" cy="12" rx="3" ry="5" fill="#A890C0"/>
    <ellipse cx="-3" cy="18" rx="3" ry="5" fill="#B8A0D0"/>
    <ellipse cx="3" cy="24" rx="3" ry="5" fill="#A890C0"/>
  </g>
  
  <!-- Savon principal -->
  <g filter="url(#shadow)">
    <!-- Face avant du savon -->
    <path d="M100 280 L100 180 C100 165 115 150 140 150 L260 150 C285 150 300 165 300 180 L300 280 C300 295 285 310 260 310 L140 310 C115 310 100 295 100 280 Z" fill="url(#lavenderSoap)"/>
    
    <!-- Face supérieure du savon (3D) -->
    <path d="M100 180 C100 165 115 150 140 150 L260 150 C285 150 300 165 300 180 L280 160 C280 150 270 140 250 140 L150 140 C130 140 120 150 120 160 Z" fill="url(#lavenderTop)"/>
    
    <!-- Texture du savon -->
    <ellipse cx="160" cy="200" rx="20" ry="8" fill="#A890C0" opacity="0.5"/>
    <ellipse cx="230" cy="220" rx="15" ry="6" fill="#A890C0" opacity="0.4"/>
    <ellipse cx="180" cy="260" rx="18" ry="7" fill="#A890C0" opacity="0.3"/>
    
    <!-- Reflet -->
    <ellipse cx="140" cy="170" rx="25" ry="10" fill="#D4C4E0" opacity="0.6"/>
  </g>
  
  <!-- Fleurs de lavande sur le savon -->
  <g transform="translate(200, 230)">
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#5A7A5A" stroke-width="2"/>
    <ellipse cx="-4" cy="-35" rx="5" ry="7" fill="#7D5FA0"/>
    <ellipse cx="4" cy="-28" rx="5" ry="7" fill="#8B6BA8"/>
    <ellipse cx="-4" cy="-21" rx="5" ry="7" fill="#7D5FA0"/>
    <ellipse cx="4" cy="-14" rx="5" ry="7" fill="#8B6BA8"/>
    <ellipse cx="0" cy="-7" rx="5" ry="7" fill="#7D5FA0"/>
  </g>
  
  <!-- Petites bulles décoratives -->
  <circle cx="320" cy="280" r="12" fill="#fff" opacity="0.4"/>
  <circle cx="340" cy="260" r="8" fill="#fff" opacity="0.3"/>
  <circle cx="80" cy="320" r="10" fill="#fff" opacity="0.35"/>
  
  <!-- Label Bio -->
  <g transform="translate(300, 320)">
    <circle cx="0" cy="0" r="30" fill="#4A7C59"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">100%</text>
    <text x="0" y="16" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">BIO</text>
  </g>
</svg>