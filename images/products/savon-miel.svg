<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="honeyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8EE"/>
      <stop offset="50%" style="stop-color:#FDF3DC"/>
      <stop offset="100%" style="stop-color:#F5E6C4"/>
    </linearGradient>
    <linearGradient id="honeySoap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C563"/>
      <stop offset="50%" style="stop-color:#E5B55F"/>
      <stop offset="100%" style="stop-color:#D4A24A"/>
    </linearGradient>
    <linearGradient id="honeyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFDC82"/>
      <stop offset="100%" style="stop-color:#F5C563"/>
    </linearGradient>
    <linearGradient id="honeyDrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E5B55F"/>
      <stop offset="100%" style="stop-color:#C9922F"/>
    </linearGradient>
    <filter id="honeyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D4A24A" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect width="400" height="400" fill="url(#honeyBg)"/>
  
  <!-- Hexagones nid d'abeille décoratifs -->
  <g opacity="0.2">
    <polygon points="50,60 65,50 80,60 80,80 65,90 50,80" fill="#E5B55F" stroke="#D4A24A" stroke-width="1"/>
    <polygon points="80,80 95,70 110,80 110,100 95,110 80,100" fill="#E5B55F" stroke="#D4A24A" stroke-width="1"/>
    <polygon points="320,300 335,290 350,300 350,320 335,330 320,320" fill="#E5B55F" stroke="#D4A24A" stroke-width="1"/>
    <polygon points="290,320 305,310 320,320 320,340 305,350 290,340" fill="#E5B55F" stroke="#D4A24A" stroke-width="1"/>
  </g>
  
  <!-- Savon principal -->
  <g filter="url(#honeyShadow)">
    <!-- Forme rectangulaire avec coins arrondis -->
    <rect x="110" y="150" width="180" height="140" rx="20" fill="url(#honeySoap)"/>
    
    <!-- Face supérieure -->
    <path d="M120 160 L280 160 L290 150 C290 140 280 135 270 135 L130 135 C120 135 110 140 110 150 Z" fill="url(#honeyTop)"/>
    
    <!-- Texture flocons d'avoine -->
    <ellipse cx="150" cy="200" rx="12" ry="5" fill="#D4A24A" opacity="0.5" transform="rotate(-20 150 200)"/>
    <ellipse cx="200" cy="220" rx="10" ry="4" fill="#D4A24A" opacity="0.4" transform="rotate(15 200 220)"/>
    <ellipse cx="250" cy="190" rx="11" ry="5" fill="#D4A24A" opacity="0.5" transform="rotate(-10 250 190)"/>
    <ellipse cx="170" cy="250" rx="9" ry="4" fill="#D4A24A" opacity="0.4" transform="rotate(25 170 250)"/>
    <ellipse cx="230" cy="260" rx="10" ry="4" fill="#D4A24A" opacity="0.45" transform="rotate(-15 230 260)"/>
    
    <!-- Reflet -->
    <ellipse cx="150" cy="165" rx="25" ry="8" fill="#FFDC82" opacity="0.7"/>
  </g>
  
  <!-- Coulée de miel -->
  <g>
    <path d="M200 100 Q200 120 195 130 Q190 150 200 150 Q210 150 205 130 Q200 120 200 100 Z" fill="url(#honeyDrip)"/>
    <ellipse cx="200" cy="155" rx="15" ry="8" fill="#E5B55F"/>
    
    <!-- Goutte de miel -->
    <ellipse cx="200" cy="100" rx="20" ry="15" fill="#F5C563"/>
    <ellipse cx="195" cy="95" rx="6" ry="4" fill="#FFDC82" opacity="0.7"/>
  </g>
  
  <!-- Abeille stylisée -->
  <g transform="translate(320, 180)">
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#F5C563"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#2D3B2D" stroke-width="2"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#2D3B2D" stroke-width="1.5" transform="rotate(90)"/>
    <circle cx="-12" cy="-2" r="5" fill="#2D3B2D"/>
    <ellipse cx="-5" cy="-12" rx="8" ry="5" fill="#fff" opacity="0.6" transform="rotate(-30 -5 -12)"/>
    <ellipse cx="5" cy="-12" rx="8" ry="5" fill="#fff" opacity="0.6" transform="rotate(30 5 -12)"/>
  </g>
  
  <!-- Flocons d'avoine éparpillés -->
  <ellipse cx="80" cy="280" rx="8" ry="3" fill="#C9A66B" opacity="0.6" transform="rotate(-30 80 280)"/>
  <ellipse cx="320" cy="350" rx="7" ry="3" fill="#C9A66B" opacity="0.5" transform="rotate(20 320 350)"/>
  <ellipse cx="60" cy="180" rx="6" ry="2.5" fill="#C9A66B" opacity="0.5" transform="rotate(-15 60 180)"/>
  
  <!-- Badge Douceur -->
  <g transform="translate(80, 340)">
    <circle cx="0" cy="0" r="32" fill="#C9A66B"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">PEAUX</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">SENSIBLES</text>
  </g>
</svg>