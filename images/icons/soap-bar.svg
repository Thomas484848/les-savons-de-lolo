<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Soap bar body -->
  <rect x="8" y="20" width="48" height="28" rx="4" fill="#A8D5A2"/>
  <rect x="10" y="22" width="44" height="24" rx="3" fill="#C1E4BD"/>
  
  <!-- Decorative lines on soap -->
  <path d="M14 30 L50 30" stroke="#8FBF89" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 36 L50 36" stroke="#8FBF89" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 42 L50 42" stroke="#8FBF89" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bubbles -->
  <circle cx="18" cy="14" r="4" fill="#E8F5E9" stroke="#A8D5A2" stroke-width="1"/>
  <circle cx="28" cy="10" r="3" fill="#E8F5E9" stroke="#A8D5A2" stroke-width="1"/>
  <circle cx="24" cy="17" r="2.5" fill="#E8F5E9" stroke="#A8D5A2" stroke-width="1"/>
  
  <circle cx="48" cy="12" r="3.5" fill="#E8F5E9" stroke="#A8D5A2" stroke-width="1"/>
  <circle cx="42" cy="8" r="2" fill="#E8F5E9" stroke="#A8D5A2" stroke-width="1"/>
  
  <!-- Small highlight on soap -->
  <ellipse cx="16" cy="26" rx="3" ry="1.5" fill="white" opacity="0.5"/>
