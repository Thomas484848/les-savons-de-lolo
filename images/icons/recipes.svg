<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Book/recipe card -->
  <rect x="10" y="8" width="44" height="48" rx="3" fill="#F5F5DC"/>
  <rect x="10" y="8" width="44" height="48" rx="3" stroke="#6B9B5E" stroke-width="2"/>
  
  <!-- Book binding -->
  <line x1="18" y1="8" x2="18" y2="56" stroke="#4A7C59" stroke-width="2"/>
  
  <!-- Decorative leaf on cover -->
  <g transform="translate(32, 24)">
    <ellipse cx="0" cy="-8" rx="6" ry="12" fill="#8FBF89" transform="rotate(15)"/>
    <ellipse cx="0" cy="-8" rx="6" ry="12" fill="#6B9B5E" transform="rotate(-15)"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#4A7C59" stroke-width="1.5"/>
  </g>
  
  <!-- Recipe lines -->
  <line x1="24" y1="40" x2="48" y2="40" stroke="#A8D5A2" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="46" x2="42" y2="46" stroke="#A8D5A2" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small decorative elements -->
  <circle cx="26" cy="20" r="2" fill="#E8B4B8"/>
  <circle cx="46" cy="22" r="1.5" fill="#B8E0D2"/>
  <circle cx="40" cy="16" r="1" fill="#D4B896"/>
</svg>
